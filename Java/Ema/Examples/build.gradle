import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform
apply plugin: 'application'

eclipse {
        project {
                name = 'RTSDK-Ema-Examples'
        }
}

def javafxVersion = "17"
configurations {
    javafxRuntime
}

if (JavaVersion.current().java11Compatible) {
    def currentOS = DefaultNativePlatform.currentOperatingSystem
    def javafxClassifier
    if (currentOS.isWindows()) {
        javafxClassifier = 'win'
    } else if (currentOS.isMacOsX()) {
        javafxClassifier = System.getProperty('os.arch') == 'aarch64' ? 'mac-aarch64' : 'mac'
    } else {
        javafxClassifier = 'linux'
    }

    dependencies {
        // Runtime – used exclusively by RTViewer tasks
        javafxRuntime "org.openjfx:javafx-base:${javafxVersion}:${javafxClassifier}"
        javafxRuntime "org.openjfx:javafx-graphics:${javafxVersion}:${javafxClassifier}"
        javafxRuntime "org.openjfx:javafx-controls:${javafxVersion}:${javafxClassifier}"
        javafxRuntime "org.openjfx:javafx-fxml:${javafxVersion}:${javafxClassifier}"
    }
}

dependencies {
    implementation project(':Ema:Core')
    implementation project(':Eta:Core')
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

// Isolate RTViewer into its own source set so JavaFX never touches
// the main (training) compile or runtime classpath.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            exclude '**/rtviewer/**'
        }
        resources {
            srcDirs = ['src/main/resources']
            exclude 'rtviewer/**'
        }
    }
    rtviewer {
        java {
            srcDirs = ['src/main/java']
            include '**/rtviewer/**'
        }
        resources {
            srcDirs = ['src/main/resources']
            include 'rtviewer/**'
        }
        // Inherits all main deps (Ema:Core, Eta:Core …) plus JavaFX
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + configurations.javafxRuntime
        runtimeClasspath += sourceSets.main.runtimeClasspath + configurations.javafxRuntime
    }
}


application {
    mainClass = 'com.refinitiv.ema.examples.training.iprovider.series100.ex100_MP_Streaming.IProvider'
}

tasks.register('createExtraRunApp', CreateStartScripts) {
    mainClass.set('com.refinitiv.ema.examples.training.iprovider.series100.ex100_MP_Streaming.IProvider')
    classpath = startScripts.classpath
    outputDir = startScripts.outputDir
    applicationName = 'iprovider100'
    classpath += files('build/classes/java')
}

tasks.register('copyDictionary') {
    outputs.files files('../../etc')
            .asFileTree
            .files
            .collect { './${it.name}' }

    doLast {
        copy {
            from '../../etc'
            into '.'
        }
    }
}

tasks.register('copyEmaConfig') {
    outputs.files files('../EmaConfig.xml')
            .asFileTree
            .files
            .collect { './${it.name}' }

    doLast {
        copy {
            from '../EmaConfig.xml'
            into '.'
        }
    }
}

tasks.register('deleteDictionary', Delete) {
    delete "$projectDir/RDMFieldDictionary"
    delete "$projectDir/RDMFieldDictionary_large"
    delete "$projectDir/enumtype.def"
}

def JVM_OPTIONS = "-Xms512m -Xmx1024m"
def JVM_OPTIONS_RTVIEWER_DESKTOP = "-Xms1g -Xmx2g"

tasks.register('deleteEmaConfig', Delete) {
    delete "$projectDir/EmaConfig.xml"
}

run.dependsOn copyDictionary, copyEmaConfig
clean.dependsOn deleteDictionary, deleteEmaConfig

tasks.withType ( JavaExec ) {
    // to enable the logger comment out the line below
    // jvmArgs += "-Djava.util.logging.config.file=../Core/src/main/resources/logging.properties"
}

/* Automatically generates the tasks for all example applications */
fileTree('.') {
    include '**/*.java'
    }.collect { relativePath(it.parent) }.each { 

    def exampleMainLocation = (it.replace(File.separator, '.') )

    def TaskName = (exampleMainLocation.substring(exampleMainLocation.lastIndexOf('.') + 1) ).replaceAll('\\D+', '')
    def TaskDescription = (exampleMainLocation.substring(exampleMainLocation.lastIndexOf('.') + 1))
    def ExampleType 

    // create tasks names, descriptions based on the type of the example and example number
    if ( exampleMainLocation.contains('niprovider') )
    {
        TaskName = 'runniprovider' + TaskName
        TaskDescription = 'NiProvider ' + TaskDescription
        exampleMainLocation = exampleMainLocation.replace('src.main.java.', '') + '.NiProvider'
        ExampleType = 'Non Interactive Provider'
    }
    else if ( exampleMainLocation.contains('consumer') )
    {
        TaskName = 'runconsumer' + TaskName
        TaskDescription = 'Consumer ' + TaskDescription
        exampleMainLocation = exampleMainLocation.replace('src.main.java.', '') + '.Consumer'
        ExampleType = 'Consumer'
    }
    else if ( exampleMainLocation.contains('iprovider') )
    {
        TaskName = 'runiprovider' + TaskName
        TaskDescription = 'IProvider ' + TaskDescription
        exampleMainLocation = exampleMainLocation.replace('src.main.java.', '') + '.IProvider'
        ExampleType = 'Interactive Provider'
    } else {
        return
    }

    // creating tasks for running all the examples dynamically
    task "${TaskName}" ( type: JavaExec ) {
        group 'Run EMA ' + ExampleType + ' Application Examples'

        description 'This task runs the ' + TaskDescription

        dependsOn copyDictionary, copyEmaConfig

        if (JVM_OPTIONS)
            jvmArgs(buildArgsList(JVM_OPTIONS))

        mainClass.set(exampleMainLocation)
        classpath = sourceSets.main.runtimeClasspath
    }
}

tasks.register('runrtviewerdesktop', JavaExec) {
    def exampleMainLocation = 'com.refinitiv.ema.examples.rtviewer.desktop.RTViewerDesktopMain'
    def TaskDescription = 'RTViewerDesktop'
    group 'Run EMA RTViewer desktop'

    description 'This task runs the ' + TaskDescription

    dependsOn copyDictionary, copyEmaConfig, rtviewerClasses

    jvmArgs += "-Djava.util.logging.config.file=src/main/resources/rtviewer/desktop/logging.properties"

    if (JVM_OPTIONS_RTVIEWER_DESKTOP)
        jvmArgs(buildArgsList(JVM_OPTIONS_RTVIEWER_DESKTOP))

    // Keep configuration phase free from JavaFX resolution.
    // JavaFX jars are resolved only when this task is actually executed.
    doFirst {
        classpath = sourceSets.rtviewer.runtimeClasspath
        if (JavaVersion.current().java11Compatible) {
            jvmArgs "--module-path", configurations.javafxRuntime.asPath,
                    "--add-modules", "javafx.controls,javafx.fxml"
        }
    }

    mainClass.set(exampleMainLocation)
}

tasks.register('createRTViewerFatJar', Jar) {

    group 'Run EMA RTViewer desktop'
    description 'This task builds fat jar for RTViewer'

        dependsOn classes, rtviewerClasses

    manifest {
        attributes(
                'Main-Class' : 'com.refinitiv.ema.examples.rtviewer.desktop.RTViewerDesktopMain'
        )
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    archiveBaseName.set('RTViewer')
    archiveBaseName.convention('RTViewer')

    from sourceSets.main.output
    from sourceSets.rtviewer.output

    // Resolve dependency trees only when the fat-jar task is executed.
    def fatJarClasspathTrees = providers.provider {
        configurations.runtimeClasspath.filter { it.exists() }.collect { it.isDirectory() ? it : zipTree(it) } +
        configurations.javafxRuntime.filter { it.exists() }.collect { it.isDirectory() ? it : zipTree(it) }
    }

    doFirst {
        from(fatJarClasspathTrees.get())
    }

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

